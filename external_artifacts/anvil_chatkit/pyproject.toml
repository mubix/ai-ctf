[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anvil-chatkit"
version = "0.3.1"
description = "Lightweight multi-persona chat console toolkit by Anvil Industries — wraps FastAPI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Anvil Industries Engineering", email = "engineering@anvil.example"},
]
keywords = ["chat", "ai", "llm", "fastapi", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.110",
  "jinja2>=3.1",
]

[project.urls]
Homepage      = "https://github.com/anvil-industries/anvil-chatkit"
Documentation = "https://github.com/anvil-industries/anvil-chatkit#readme"
Issues        = "https://github.com/anvil-industries/anvil-chatkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/anvil_chatkit"]
